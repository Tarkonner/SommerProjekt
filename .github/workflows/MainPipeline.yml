name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository                     
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    # C#
    - name: Set up .NET 8                            
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    # Restore NuGet packages                         
    - name: Restore Dependencies
      run: dotnet restore

    - name: List project files
      run: find . -name "*.csproj"

    # Run unit tests                                 
    - name: Run unit tests with detailed logging
      run: |
        dotnet test ./ServerTests/ServerTests.csproj --logger:"console;verbosity=detailed" --blame
        dotnet test ./ConnectionTests/CommenCompunentTests.csproj --logger:"console;verbosity=detailed" --blame
      # dotnet test ./ClientTests/ClientTests.csproj

    # Set up QEMU (required for multi-platform builds)
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
      with:
        platforms: all

    # Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      with:
        install: true
        driver: docker-container

    # Optional: Inspect Buildx builder
    - name: Inspect Buildx builder
      run: docker buildx ls

    # Docker server image build
    - name: Build server Docker image
      run: |
        docker buildx build --platform linux/amd64,linux/arm64 \
          -f Server/Dockerfile \
          --tag my-server:latest \
          --push \
          .

    # Docker client image build
    - name: Build client Docker image
      run: |
        docker buildx build --platform linux/amd64,linux/arm64 \
          -f Client/Dockerfile \
          --tag my-client:latest \
          --push \
          .

    # Create Docker network for communication
    - name: Create Docker network
      run: docker network create test-net

    # Start server container in background
    - name: Start server container
      run: docker run -d --name server --network test-net my-server

    # Wait a few seconds for the server to start
    - name: Wait for server to initialize
      run: sleep 5

    # Run first client container
    - name: Run client container 1
      run: docker run --network test-net my-client

    # Run second client container
    - name: Run client container 2
      run: docker run --network test-net my-client

    # Optionally output server logs
    - name: Print server logs (optional)
      run: docker logs server
